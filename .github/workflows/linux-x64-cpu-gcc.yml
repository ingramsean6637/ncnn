name: linux-x64-cpu-gcc
concurrency:
  group: linux-x64-cpu-gcc-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux-gcc-avx512:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG linux-gcc-avx512 pre-build"
        echo "GERALT_DBG pwd=$(pwd)"
        if [ -f CMakeLists.txt ]; then
          echo "GERALT_DBG CMakeLists.txt present"
          ls -la CMakeLists.txt 2>/dev/null || echo "GERALT_DBG ls failed"
          grep -n -i 'execute_process' CMakeLists.txt 2>/dev/null || echo "GERALT_DBG no execute_process match in CMakeLists.txt"
        else
          echo "GERALT_DBG CMakeLists.txt missing"
        fi
        if [ -d cmake ]; then
          echo "GERALT_DBG cmake dir present"
          ls cmake 2>/dev/null | head -n 20 || echo "GERALT_DBG cmake listing failed"
        else
          echo "GERALT_DBG cmake dir missing"
        fi
        if [ -d tests ]; then echo "GERALT_DBG tests dir present"; else echo "GERALT_DBG tests dir missing"; fi
        git log -1 --oneline 2>/dev/null || echo "GERALT_DBG git log unavailable"
      continue-on-error: true
    - name: build
      env:
        CC: gcc
        CXX: g++
        LD_LIBRARY_PATH: /data/action/install/lib64
      run: |
        mkdir build && cd build
        cmake -DNCNN_AVX2=ON -DNCNN_AVX512=ON -DNCNN_AVX512VNNI=ON -DNCNN_BUILD_TESTS=ON -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF ..
        cmake --build . -j 4
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG linux-gcc-avx512 pre-test"
        if [ -d build ]; then
          echo "GERALT_DBG build dir present"
          ls build 2>/dev/null | head -n 20 || echo "GERALT_DBG build listing failed"
        else
          echo "GERALT_DBG build dir missing (build step may have failed)"
        fi
        if [ -f build/CTestTestfile.cmake ] || [ -d build/Testing ]; then echo "GERALT_DBG ctest metadata present"; else echo "GERALT_DBG ctest metadata absent"; fi
      continue-on-error: true
    - name: test
      env:
        LD_LIBRARY_PATH: /data/action/install/lib64
      run: cd build && ctest --output-on-failure -j 4
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - master
    paths:
    - .github/workflows/linux-x64-cpu-gcc.yml
    - toolchains/host-c.gcc.toolchain.cmake
    - CMakeLists.txt
    - cmake/**
    - src/*
    - src/layer/*
    - src/layer/x86/**
    - tests/**
    - tools/**
    - '!tools/pnnx/**'
    - examples/**
  pull_request:
    branches:
    - master
    paths:
    - .github/workflows/linux-x64-cpu-gcc.yml
    - toolchains/host-c.gcc.toolchain.cmake
    - CMakeLists.txt
    - cmake/**
    - src/*
    - src/layer/*
    - src/layer/x86/**
    - tests/**
    - tools/**
    - '!tools/pnnx/**'
    - examples/**
